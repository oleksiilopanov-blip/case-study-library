<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Euristiq Case Study Library
   Tokens: Euristiq Design Language System (Figma) - Semantic collection, Dark
   mode. Components follow DLS "Tag", "Button", "input-field" and "card/image".
   Spacing is on the 8px grid; radius is 8 or 360 only.
   ========================================================================== */
:root{
  --surface-base:#0D0D0D;
  --surface-subtle:rgba(255,255,255,.03);
  --surface-elevated:rgba(255,255,255,.05);
  --surface-inverse:#FFFFFF;
  --surface-emphasis:#402280;
  --surface-brand:#7B44F7;
  --surface-disabled:#212121;
  --text-primary:#FFFFFF;
  --text-secondary:#CCCCCC;
  --text-tertiary:#808080;
  --text-inverse:#0D0D0D;
  --text-brand:#9569F9;
  --border-base:#333333;
  --border-neutral:#808080;
  --border-brand:#7B44F7;
  --focus:#7B44F7;

  --font:"Open Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:8px; --pill:360px;
  --gutter:24px; --page:1440px; --rail:288px; --top:80px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:calc(var(--top) + 16px)}
body{margin:0; background:var(--surface-base); color:var(--text-primary);
  font:400 16px/24px var(--font); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
img{display:block; max-width:100%}
a{color:inherit}
button,input,select{font:inherit; color:inherit}
button{background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.ico{width:20px; height:20px; fill:currentColor; flex:none}
mark{background:var(--surface-emphasis); color:var(--text-primary); border-radius:4px; padding:0 2px}
.container{max-width:var(--page); margin:0 auto; padding:0 40px}
[hidden]{display:none!important}

/* ---------------------------------------------------------------- header */
.top{position:sticky; top:0; z-index:30; height:var(--top);
  background:rgba(13,13,13,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-base)}
.top .container{height:100%; display:flex; align-items:center; gap:24px}
.logo{height:32px; width:auto; display:block}
.top .divider{width:1px; height:24px; background:var(--border-base)}
.top .name{font-weight:600; color:var(--text-secondary)}
.top .spacer{flex:1}
.top .meta{display:flex; align-items:center; gap:8px; color:var(--text-tertiary); font-size:14px}

/* ---------------------------------------------------------------- hero + search */
.hero{padding-top:64px; padding-bottom:48px}
.hero h1{margin:0; font-size:48px; line-height:56px; font-weight:800; letter-spacing:-.02em}
.hero p{margin:16px 0 0; color:var(--text-secondary); font-size:18px; line-height:28px; max-width:880px; text-wrap:pretty}
.search{position:relative; margin-top:32px; max-width:880px}
.search .ico{position:absolute; left:20px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); width:24px; height:24px; pointer-events:none}
.search input{width:100%; height:64px; padding:0 112px 0 56px; border-radius:var(--r);
  background:var(--surface-subtle); border:1px solid var(--border-base); color:var(--text-primary);
  font-size:18px; outline:none; transition:border-color .15s}
.search input::placeholder{color:var(--text-tertiary)}
.search input:hover{border-color:var(--border-neutral)}
.search input:focus{border-color:var(--border-brand); box-shadow:0 0 0 1px var(--border-brand)}
.search input::-webkit-search-cancel-button{display:none}
.search .end{position:absolute; right:16px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:8px}
.search kbd{font:600 12px/16px var(--font); color:var(--text-tertiary); border:1px solid var(--border-base); border-radius:var(--r); padding:4px 8px}
.iconbtn{width:40px; height:40px; display:inline-grid; place-items:center; border-radius:var(--pill); color:var(--text-secondary);
  background:var(--surface-disabled); transition:background .15s,color .15s}
.iconbtn:hover{background:var(--surface-inverse); color:var(--text-inverse)}
.iconbtn.ghost{background:none}
.iconbtn.ghost:hover{background:var(--surface-elevated); color:var(--text-primary)}
.search .iconbtn{width:32px; height:32px}
.search .iconbtn .ico{position:static; transform:none; width:16px; height:16px; color:inherit}
.hint{margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; color:var(--text-tertiary); font-size:14px}

/* ---------------------------------------------------------------- layout */
.layout{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:48px; padding-bottom:96px}

/* ---------------------------------------------------------------- filter rail */
.rail{position:sticky; top:calc(var(--top) + 24px); align-self:start; max-height:calc(100vh - var(--top) - 48px); overflow:auto;
  padding-right:8px; scrollbar-width:thin; scrollbar-color:var(--border-base) transparent}
.railhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px}
.railhead h2{margin:0; font-size:20px; line-height:28px; font-weight:700}
.link{color:var(--text-brand); font-weight:700; font-size:14px; line-height:24px}
.link:hover{text-decoration:underline}
.link:disabled{color:var(--text-tertiary); cursor:default; text-decoration:none}
.group{padding:24px 0; border-top:1px solid var(--border-base)}
.group h3{margin:0 0 16px; font-size:12px; line-height:16px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-tertiary)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.more{margin-top:16px}

/* DLS Tag - default / hover / active */
.tag{display:inline-flex; align-items:center; gap:8px; min-height:32px; padding:4px 16px; border-radius:var(--pill);
  background:var(--surface-subtle); border:1px solid var(--border-base); color:var(--text-primary);
  font-size:14px; line-height:20px; text-align:left; transition:background .15s,color .15s,border-color .15s}
button.tag:hover{background:var(--surface-inverse); border-color:var(--surface-inverse); color:var(--text-inverse)}
button.tag:hover .n{color:var(--text-inverse)}
.tag[aria-pressed="true"], button.tag[aria-pressed="true"]:hover{background:var(--surface-emphasis); border-color:var(--border-brand); color:var(--text-primary)}
.tag[aria-pressed="true"] .n, button.tag[aria-pressed="true"]:hover .n{color:var(--text-secondary)}
.tag .n{font-size:12px; color:var(--text-tertiary); font-variant-numeric:tabular-nums}
.tag.zero{opacity:.4}
.tag.static{cursor:default}
.tag.sm{min-height:28px; padding:2px 12px; font-size:13px}
.tag .ico{width:16px; height:16px}

/* ---------------------------------------------------------------- toolbar */
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-bottom:24px; min-height:40px}
.count{font-weight:600}
.count span{color:var(--text-tertiary); font-weight:400}
.active{display:flex; flex-wrap:wrap; gap:8px; flex:1}
.active .tag{background:var(--surface-emphasis); border-color:var(--border-brand); padding-right:8px}
.active .tag .ico{width:14px; height:14px}
.sort{display:flex; align-items:center; gap:8px; color:var(--text-tertiary); font-size:14px; margin-left:auto}
.select{position:relative}
.select select{appearance:none; -webkit-appearance:none; height:40px; padding:0 40px 0 16px; border-radius:var(--r);
  background:var(--surface-subtle); border:1px solid var(--border-base); color:var(--text-primary); font-size:14px; cursor:pointer}
.select select:hover{border-color:var(--border-neutral)}
.select select option{background:#141414}
.select .ico{position:absolute; right:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; pointer-events:none; color:var(--text-secondary)}
.btn.filterbtn{display:none}

/* ---------------------------------------------------------------- buttons (DLS Button) */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 24px; border-radius:var(--pill);
  font-weight:700; font-size:16px; line-height:24px; text-decoration:none; white-space:nowrap; border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s}
.btn .ico{width:20px; height:20px}
.btn.primary{background:var(--surface-brand); border-color:var(--surface-brand); color:#fff}
.btn.primary:hover{background:var(--surface-emphasis); border-color:var(--surface-emphasis)}
.btn.secondary{background:var(--surface-disabled); color:var(--text-secondary)}
.btn.secondary:hover{background:#141414; border-color:var(--border-brand); color:var(--text-primary)}
.btn.tertiary{border-color:var(--text-primary); color:var(--text-primary)}
.btn.tertiary:hover{background:var(--surface-inverse); color:var(--text-inverse)}
.btn.sm{height:40px; padding:0 16px; font-size:14px}

/* ---------------------------------------------------------------- cards (DLS card/image) */
.grid{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:var(--gutter)}
.card{display:flex; flex-direction:column; background:var(--surface-elevated); border-radius:var(--r); overflow:hidden; position:relative}
.card .media{display:block; position:relative; aspect-ratio:4/3; background:#141414; overflow:hidden; width:100%}
.card .media img{width:100%; height:100%; object-fit:cover; object-position:center top; transition:transform .3s ease}
.card:hover .media img{transform:scale(1.03)}
.card .badges{position:absolute; left:16px; top:16px; display:flex; gap:8px}
.badge{display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 12px; border-radius:var(--pill);
  background:rgba(13,13,13,.8); backdrop-filter:blur(4px); border:1px solid var(--border-base); font-size:12px; font-weight:600; color:var(--text-secondary)}
.badge .ico{width:14px; height:14px}
.card .body{padding:24px 24px 0; display:flex; flex-direction:column; gap:16px; flex:1}
.label{margin:0; color:var(--text-brand); font-size:14px; line-height:20px; font-weight:600}
.label .sep{color:var(--text-tertiary); padding:0 4px}
.card h3{text-wrap:balance; margin:-8px 0 0; font-size:20px; line-height:28px; font-weight:700; letter-spacing:-.01em}
.card h3 button{text-align:left}
.card h3 button:hover{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:4px}
.card h3 button::after{content:""; position:absolute; inset:0; z-index:0}
.card .desc{margin:-8px 0 0; color:var(--text-secondary); font-size:14px; line-height:24px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.card .hit{margin:0; font-size:14px; line-height:20px; color:var(--text-secondary); padding:8px 12px; border-left:2px solid var(--border-brand); background:var(--surface-subtle)}
.card .hit b{color:var(--text-tertiary); font-weight:600}
.stat{margin:0; display:flex; flex-direction:column; gap:0}
.stat dt{font-size:12px; line-height:16px; color:var(--text-tertiary); order:2}
.stat dd{margin:0; font-size:16px; line-height:24px; font-weight:700; order:1}
.card .tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; position:relative; z-index:1}
.card .actions{display:flex; align-items:center; gap:8px; padding:24px; position:relative; z-index:1}
.card .actions .btn{margin-right:auto}
.card .media, .card .actions, .card .tags{z-index:1}

.empty{padding:64px 24px; text-align:center; border:1px dashed var(--border-base); border-radius:var(--r)}
.empty h3{margin:0 0 8px; font-size:20px; line-height:28px}
.empty p{margin:0; color:var(--text-secondary)}

/* ---------------------------------------------------------------- preview */
.pv{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:32px;
  background:rgba(0,0,0,.72); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
.pv-panel{width:min(1440px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--surface-base);
  border:1px solid var(--border-base); border-radius:var(--r); overflow:hidden}
.pv-top{display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--border-base)}
.pv-top .pos{color:var(--text-tertiary); font-size:14px; flex:1}
.pv-body{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); overflow:auto; flex:1}
.pv-media{padding:24px; display:flex; flex-direction:column; gap:24px; border-right:1px solid var(--border-base)}
.pv-media .frame{border-radius:var(--r); overflow:hidden; background:#141414; aspect-ratio:16/9}
.pv-media .frame img{width:100%; height:100%; object-fit:contain}
.pv-media .acts{display:flex; flex-wrap:wrap; gap:16px}
.pv-media .note{margin:0; font-size:14px; color:var(--text-tertiary)}
.pv-text{padding:32px; overflow:auto; user-select:text}
.pv-text h2{text-wrap:balance; margin:8px 0 0; font-size:32px; line-height:40px; font-weight:800; letter-spacing:-.02em}
.pv-text .lead{margin:16px 0 0; color:var(--text-secondary)}
.pv-text h4{margin:40px 0 16px; font-size:12px; line-height:16px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-tertiary)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:32px}
.stats .box{background:var(--surface-elevated); border-radius:var(--r); padding:12px 16px}
.stats .box dt{font-size:12px; line-height:16px; color:var(--text-tertiary)}
.stats .box dd{margin:4px 0 0; font-size:16px; line-height:24px; font-weight:600}
.outcomes{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:24px}
.outcomes li{display:grid; grid-template-columns:40px 1fr; gap:16px}
.outcomes .chip{width:40px; height:40px; border-radius:var(--r); display:grid; place-items:center;
  background:var(--surface-elevated); border:1px solid var(--border-base); color:var(--text-primary)}
.outcomes strong{display:block; font-size:16px; line-height:24px; font-weight:700}
.outcomes p{margin:4px 0 0; color:var(--text-secondary); font-size:14px; line-height:24px}
.toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%); z-index:60; padding:12px 24px; border-radius:var(--pill);
  background:var(--surface-inverse); color:var(--text-inverse); font-weight:600; font-size:14px}

footer.foot{border-top:1px solid var(--border-base); padding:32px 0; color:var(--text-tertiary); font-size:14px}
footer.foot .container{display:flex; gap:16px; flex-wrap:wrap; justify-content:space-between}

/* ---------------------------------------------------------------- responsive */
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed; z-index:45; inset:0 0 0 auto; width:min(400px,100%); max-height:none; height:100vh; height:100dvh; align-self:auto; padding:24px;
    background:var(--surface-base); border-left:1px solid var(--border-base); transform:translateX(100%); transition:transform .25s ease; overflow:auto}
  .rail.open{transform:none}
  .rail .apply{position:sticky; bottom:-24px; margin:24px -24px -24px; padding:16px 24px; background:var(--surface-base); border-top:1px solid var(--border-base)}
  .btn.filterbtn{display:inline-flex}
  .scrim{position:fixed; inset:0; z-index:44; background:rgba(0,0,0,.6)}
  .pv-body{grid-template-columns:minmax(0,1fr)}
  .pv-media{border-right:0; border-bottom:1px solid var(--border-base)}
}
@media (min-width:1101px){ .rail .apply, .rail .close{display:none} .scrim{display:none} }
@media (max-width:720px){
  .container{padding:0 16px}
  .top .name{font-size:14px}
  .top .meta{display:none}
  .hero{padding-top:40px; padding-bottom:32px}
  .hero h1{font-size:32px; line-height:40px}
  .hero p{font-size:16px; line-height:24px}
  .search input{height:56px; font-size:16px; padding-right:56px}
  .search kbd{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  .sort{margin-left:0}
  .pv{padding:0}
  .pv-panel{border-radius:0; border:0; height:100%}
  .pv-media,.pv-text{padding:16px}
  .pv-text h2{font-size:24px; line-height:32px}
  .pv-media .acts .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">__ICONS__</svg>

<header class="top">
  <div class="container">
    __LOGO__
    <span class="divider" aria-hidden="true"></span>
    <span class="name">Case Study Library</span>
    <span class="spacer"></span>
    <span class="meta"><svg class="ico"><use href="#i-lock"/></svg> Internal &middot; not for distribution</span>
  </div>
</header>

<section class="hero container">
  <h1>Case studies</h1>
  <p id="heroSub"></p>
  <div class="search" role="search">
    <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
    <label class="sr" for="q">Search case studies</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search titles, descriptions, tags and outcomes">
    <div class="end">
      <button class="iconbtn" id="clrQ" aria-label="Clear search" hidden><svg class="ico"><use href="#i-x"/></svg></button>
      <kbd aria-hidden="true">/</kbd>
    </div>
  </div>
</section>

<div class="container layout">
  <aside class="rail" id="rail" aria-label="Filters">
    <div class="railhead">
      <h2>Filters</h2>
      <div style="display:flex;gap:16px;align-items:center">
        <button class="link" id="clrAll" disabled>Clear all</button>
        <button class="iconbtn ghost close" id="railClose" aria-label="Close filters"><svg class="ico"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div id="facets"></div>
    <div class="apply"><button class="btn primary" id="railApply" style="width:100%">Show results</button></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main">
    <div class="toolbar">
      <button class="btn secondary sm filterbtn" id="railOpen" aria-controls="rail"><svg class="ico"><use href="#i-funnel"/></svg><span id="railOpenLbl">Filters</span></button>
      <div class="count" id="count" aria-live="polite"></div>
      <div class="active" id="active"></div>
      <div class="sort">
        <label for="sort">Sort</label>
        <div class="select">
          <select id="sort">
            <option value="auto">Best match</option>
            <option value="title">Title A–Z</option>
            <option value="client">Client A–Z</option>
          </select>
          <svg class="ico" aria-hidden="true"><use href="#i-caret-down"/></svg>
        </div>
      </div>
    </div>
    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty" hidden>
      <h3>No case studies match</h3>
      <p>Try another keyword or <button class="link" id="resetBtn">clear all filters</button>.</p>
    </div>
  </main>
</div>

<footer class="foot"><div class="container"><span>Euristiq &middot; Case Study Library</span><span>Every title, tag and outcome on this page is read from the PDF itself.</span></div></footer>

<div class="pv" id="pv" role="dialog" aria-modal="true" aria-labelledby="pvTitle" hidden>
  <div class="pv-panel">
    <div class="pv-top">
      <span class="pos" id="pvPos"></span>
      <button class="iconbtn" id="pvPrev" aria-label="Previous case study"><svg class="ico"><use href="#i-caret-left"/></svg></button>
      <button class="iconbtn" id="pvNext" aria-label="Next case study"><svg class="ico"><use href="#i-caret-right"/></svg></button>
      <button class="iconbtn" id="pvClose" aria-label="Close preview"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="pv-body">
      <div class="pv-media">
        <div class="frame"><img id="pvImg" alt=""></div>
        <div class="acts">
          <a class="btn primary" id="pvDl" download><svg class="ico"><use href="#i-download"/></svg>Download PDF</a>
          <a class="btn tertiary" id="pvOpen" target="_blank" rel="noopener"><svg class="ico"><use href="#i-ext"/></svg>Open in new tab</a>
          <button class="btn secondary" id="pvCopy"><svg class="ico"><use href="#i-link"/></svg>Copy link</button>
        </div>
        <p class="note" id="pvNote"></p>
      </div>
      <article class="pv-text" id="pvText"></article>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
var CFG = __CFG__;
var DATA = JSON.parse(document.getElementById("data").textContent);
var $ = function(id){ return document.getElementById(id); };

/* ------------------------------------------------------------ facets */
var FACETS = [
  {key:"services",   label:"Services",    many:true,  show:12},
  {key:"tech",       label:"Technology",  many:true,  show:13},
  {key:"industries", label:"Domain",      many:true,  show:12},
  {key:"client",     label:"Client",      many:false, show:10},
  {key:"locations",  label:"Location",    many:true,  show:12}
];
function tagKey(d, t){ return d.tech.indexOf(t) !== -1 ? "tech" : "services"; }
function values(item, f){ var v = item[f.key]; return f.many ? (v || []) : (v ? [v] : []); }

/* ------------------------------------------------------------ search index */
function norm(s){
  return String(s || "").normalize("NFKD").toLowerCase().replace(/[\u0300-\u036f]/g, "")
    .replace(/[\u2018\u2019\u02bc]/g, "'").replace(/[\u201c\u201d]/g, '"')
    .replace(/[\u2010-\u2015\u2212]/g, "-").replace(/\s+/g, " ");
}
var WEIGHTS = {title:8, client:6, tags:5, place:4, outcomes:3, stats:3, desc:2, raw:1};
DATA.forEach(function(d, i){
  d.idx = i;
  d.ix = {
    title: norm(d.title), client: norm(d.client), tags: norm(d.tags.join(" | ")),
    place: norm(d.industries.concat(d.locations).join(" | ")),
    outcomes: norm(d.outcomes.map(function(o){ return o.title + " " + o.detail; }).join(" | ")),
    stats: norm(d.highlights.map(function(h){ return h.label + " " + h.value; }).join(" | ")),
    desc: norm(d.description), raw: norm(d.raw)
  };
});
function parseQuery(q){
  var out = [], m, re = /"([^"]+)"|(\S+)/g;
  q = norm(q);
  while ((m = re.exec(q))) {
    var t = (m[1] || m[2]).replace(/^[^\w$£€~+#]+|[^\w%+#×]+$/g, "").replace(/'s$/, "");
    if (t) out.push(t);
  }
  return out;
}
function score(d, terms){
  if (!terms.length) return 1;
  var total = 0;
  for (var i = 0; i < terms.length; i++) {
    var best = 0;
    for (var k in WEIGHTS) if (d.ix[k].indexOf(terms[i]) !== -1 && WEIGHTS[k] > best) best = WEIGHTS[k];
    if (!best) return 0;
    total += best;
  }
  return total;
}

/* ------------------------------------------------------------ state */
var state = {q:"", sel:{}, sort:"auto", open:null};
FACETS.forEach(function(f){ state.sel[f.key] = []; });
var expanded = {};
var visible = [];

function readHash(){
  var p = new URLSearchParams(location.hash.slice(1));
  state.q = p.get("q") || "";
  FACETS.forEach(function(f){ state.sel[f.key] = p.get(f.key) ? p.get(f.key).split("|") : []; });
  state.sort = p.get("sort") || "auto";
  state.open = p.get("case");
}
function writeHash(){
  var p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  FACETS.forEach(function(f){ if (state.sel[f.key].length) p.set(f.key, state.sel[f.key].join("|")); });
  if (state.sort !== "auto") p.set("sort", state.sort);
  if (state.open) p.set("case", state.open);
  var h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}

/* ------------------------------------------------------------ filtering */
function matches(d, skip){
  for (var i = 0; i < FACETS.length; i++) {
    var f = FACETS[i], sel = state.sel[f.key];
    if (f.key === skip || !sel.length) continue;
    var v = values(d, f), ok = false;
    for (var j = 0; j < sel.length; j++) if (v.indexOf(sel[j]) !== -1) { ok = true; break; }
    if (!ok) return false;
  }
  return true;
}
function compute(){
  var terms = parseQuery(state.q);
  var scored = DATA.map(function(d){ return {d:d, s:score(d, terms)}; }).filter(function(x){ return x.s > 0; });
  var res = scored.filter(function(x){ return matches(x.d); });
  var sort = state.sort === "auto" ? (terms.length ? "relevance" : "client") : state.sort;
  res.sort(function(a, b){
    if (sort === "relevance" && b.s !== a.s) return b.s - a.s;
    if (sort === "client") {
      var c = a.d.confidential - b.d.confidential || a.d.client.localeCompare(b.d.client);
      if (c) return c;
    }
    return a.d.title.localeCompare(b.d.title);
  });
  return {terms:terms, items:res.map(function(x){ return x.d; }), searched:scored.map(function(x){ return x.d; })};
}

/* ------------------------------------------------------------ html helpers */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var termRe = null;
function buildTermRe(terms){
  if (!terms.length) { termRe = null; return; }
  var parts = terms.slice().sort(function(a,b){ return b.length - a.length; }).map(function(t){
    return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/'/g, "['\u2018\u2019]").replace(/-/g, "[-\u2010-\u2015]").replace(/ /g, "\\s+");
  });
  termRe = new RegExp("(" + parts.join("|") + ")", "gi");
}
function hl(s){
  s = String(s || "");
  if (!termRe) return esc(s);
  var out = "", last = 0, m;
  termRe.lastIndex = 0;
  while ((m = termRe.exec(s))) {
    if (!m[0]) { termRe.lastIndex++; continue; }
    out += esc(s.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
function icon(id){ return '<svg class="ico" aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
function pdfHref(d){
  if (!CFG.embedded) return d.href;
  if (!d._blob) {
    var bin = atob(d.data), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    d._blob = URL.createObjectURL(new Blob([arr], {type:"application/pdf"}));
  }
  return d._blob;
}
function labelLine(d){
  var parts = [esc(d.client)];
  if (d.industries.length) parts.push(esc(d.industries.join(", ")));
  return parts.join('<span class="sep">·</span>');
}

/* ------------------------------------------------------------ render: facets */
function renderFacets(searched){
  var html = "";
  FACETS.forEach(function(f){
    var counts = {};
    DATA.forEach(function(d){ values(d, f).forEach(function(v){ if (!(v in counts)) counts[v] = 0; }); });
    searched.forEach(function(d){ if (matches(d, f.key)) values(d, f).forEach(function(v){ counts[v]++; }); });
    var sel = state.sel[f.key];
    var vals = Object.keys(counts).sort(function(a, b){
      var sa = sel.indexOf(a) !== -1, sb = sel.indexOf(b) !== -1;
      if (sa !== sb) return sa ? -1 : 1;
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    var shown = expanded[f.key] ? vals : vals.slice(0, f.show);
    html += '<section class="group"><h3 id="g-' + f.key + '">' + esc(f.label) + '</h3><div class="chips" role="group" aria-labelledby="g-' + f.key + '">';
    shown.forEach(function(v){
      var on = sel.indexOf(v) !== -1;
      html += '<button class="tag' + (!counts[v] && !on ? " zero" : "") + '" aria-pressed="' + on + '" data-f="' + f.key + '" data-v="' + esc(v) + '">'
           + esc(v) + ' <span class="n">' + counts[v] + '</span></button>';
    });
    html += '</div>';
    if (vals.length > f.show) {
      html += '<button class="link more" data-more="' + f.key + '">' + (expanded[f.key] ? "Show fewer" : "Show all " + vals.length) + '</button>';
    }
    html += '</section>';
  });
  $("facets").innerHTML = html;
}

/* ------------------------------------------------------------ render: cards */
function firstHit(d, terms){
  if (!terms.length) return "";
  var seen = norm(d.title + " " + d.description + " " + d.client + " " + d.industries.join(" ") + " " + d.tags.slice(0, 3).join(" "));
  var missing = terms.filter(function(t){ return seen.indexOf(t) === -1; });
  if (!missing.length) return "";
  for (var i = 0; i < d.outcomes.length; i++) {
    var o = d.outcomes[i], txt = norm(o.title + " " + o.detail);
    if (missing.some(function(t){ return txt.indexOf(t) !== -1; })) {
      return '<p class="hit"><b>Outcome:</b> ' + hl(o.title) + (o.detail ? " — " + hl(o.detail) : "") + '</p>';
    }
  }
  for (var j = 1; j < d.highlights.length; j++) {   // [0] is already on the card
    var h = d.highlights[j];
    if (missing.some(function(t){ return norm(h.label + " " + h.value).indexOf(t) !== -1; })) {
      return '<p class="hit"><b>' + esc(h.label) + ':</b> ' + hl(h.value) + '</p>';
    }
  }
  var more = d.tags.slice(3).filter(function(t){ return missing.some(function(m){ return norm(t).indexOf(m) !== -1; }); });
  if (more.length) return '<p class="hit"><b>Tag:</b> ' + more.map(hl).join(", ") + '</p>';
  return "";
}
function card(d, terms){
  var badges = "";
  if (d.confidential) badges += '<span class="badge">' + icon("lock") + 'NDA</span>';
  if (d.internal) badges += '<span class="badge">Internal only</span>';
  var stat = d.highlights[0]
    ? '<dl class="stat"><dt>' + esc(d.highlights[0].label) + '</dt><dd>' + hl(d.highlights[0].value) + '</dd></dl>' : "";
  var tags = d.tags.slice(0, 3).map(function(t){
    var k = tagKey(d, t), on = state.sel[k].indexOf(t) !== -1;
    return '<button class="tag sm" aria-pressed="' + on + '" data-f="' + k + '" data-v="' + esc(t) + '">' + hl(t) + '</button>';
  }).join("");
  if (d.tags.length > 3) tags += '<span class="tag sm static">+' + (d.tags.length - 3) + '</span>';
  return '<li class="card" data-id="' + esc(d.id) + '">'
    + '<button class="media" data-open="' + esc(d.id) + '" tabindex="-1" aria-hidden="true">'
    + (d.thumb ? '<img loading="lazy" decoding="async" src="' + esc(d.thumb) + '" alt="">' : "")
    + (badges ? '<span class="badges">' + badges + '</span>' : "") + '</button>'
    + '<div class="body">'
    + '<p class="label">' + labelLine(d) + '</p>'
    + '<h3><button data-open="' + esc(d.id) + '">' + hl(d.title) + '</button></h3>'
    + '<p class="desc">' + hl(d.description) + '</p>'
    + firstHit(d, terms) + stat
    + '<div class="tags">' + tags + '</div>'
    + '</div>'
    + '<div class="actions">'
    + '<button class="btn secondary sm" data-open="' + esc(d.id) + '">Preview</button>'
    + '<a class="iconbtn" href="' + esc(CFG.embedded ? "#" : d.href) + '" data-pdf="' + esc(d.id) + '" target="_blank" rel="noopener" title="Open PDF in new tab" aria-label="Open ' + esc(d.title) + ' PDF in new tab">' + icon("ext") + '</a>'
    + '<a class="iconbtn" href="' + esc(CFG.embedded ? "#" : d.href) + '" data-pdf="' + esc(d.id) + '" download="' + esc(d.dl) + '" title="Download PDF" aria-label="Download ' + esc(d.title) + ' PDF">' + icon("download") + '</a>'
    + '</div></li>';
}

/* ------------------------------------------------------------ render: all */
function render(){
  var r = compute();
  visible = r.items;
  buildTermRe(r.terms);
  renderFacets(r.searched);
  $("grid").innerHTML = r.items.map(function(d){ return card(d, r.terms); }).join("");
  $("empty").hidden = r.items.length > 0;
  $("count").innerHTML = r.items.length === DATA.length
    ? DATA.length + " case studies"
    : r.items.length + ' <span>of ' + DATA.length + '</span>';
  var nSel = 0, chips = "";
  FACETS.forEach(function(f){
    state.sel[f.key].forEach(function(v){
      nSel++;
      chips += '<button class="tag" data-f="' + f.key + '" data-v="' + esc(v) + '" aria-label="Remove filter ' + esc(v) + '">' + esc(v) + icon("x") + '</button>';
    });
  });
  $("active").innerHTML = chips;
  $("clrAll").disabled = !nSel && !state.q;
  $("railOpenLbl").textContent = nSel ? "Filters (" + nSel + ")" : "Filters";
  $("railApply").textContent = "Show " + r.items.length + (r.items.length === 1 ? " result" : " results");
  $("clrQ").hidden = !state.q;
  $("sort").value = state.sort;
  writeHash();
}

/* ------------------------------------------------------------ preview */
var lastFocus = null;
function byId(id){ for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i]; return null; }
function openPreview(id){
  var d = byId(id);
  if (!d) return;
  if ($("pv").hidden) lastFocus = document.activeElement;
  state.open = id;
  var list = visible.indexOf(d) !== -1 ? visible : DATA;
  var pos = list.indexOf(d);
  $("pvPos").textContent = (pos + 1) + " of " + list.length;
  $("pvPrev").disabled = list.length < 2; $("pvNext").disabled = list.length < 2;
  $("pvImg").src = d.full || d.thumb || "";
  $("pvImg").alt = "Page preview: " + d.title;
  var href = pdfHref(d);
  $("pvDl").href = href; $("pvDl").setAttribute("download", d.dl);
  $("pvOpen").href = href;
  $("pvCopy").hidden = !!CFG.embedded;
  $("pvNote").textContent = "PDF · " + Math.max(1, Math.round(d.bytes / 1024)) + " KB · text in the PDF is selectable and searchable";

  var stats = [];
  if (d.industries.length) stats.push(["Domain", d.industries.join(", ")]);
  if (d.locations.length) stats.push(["Location", d.locations.join(", ")]);
  d.highlights.forEach(function(h){ stats.push([h.label, h.value]); });
  var html = '<p class="label">' + labelLine(d) + (d.confidential ? '<span class="sep">·</span>NDA' : "") + (d.internal ? '<span class="sep">·</span>Internal only' : "") + '</p>'
    + '<h2 id="pvTitle">' + hl(d.title) + '</h2>'
    + '<p class="lead">' + hl(d.description) + '</p>'
    + (stats.length ? '<dl class="stats">' + stats.map(function(s){ return '<div class="box"><dt>' + esc(s[0]) + '</dt><dd>' + hl(s[1]) + '</dd></div>'; }).join("") + '</dl>' : "")
    + tagSection("Services", "services", d.services)
    + tagSection("Technology", "tech", d.tech)
    + (d.outcomes.length ? '<h4>Outcomes</h4><ol class="outcomes">' + d.outcomes.map(function(o){
        return '<li><span class="chip">' + icon("check") + '</span><div><strong>' + hl(o.title) + '</strong>' + (o.detail ? '<p>' + hl(o.detail) + '</p>' : "") + '</div></li>';
      }).join("") + '</ol>' : "");
  $("pvText").innerHTML = html;
  $("pvText").scrollTop = 0;
  if ($("pv").hidden) {
    $("pv").hidden = false;
    document.body.style.overflow = "hidden";
    $("pvClose").focus();
  }
  writeHash();
}
function tagSection(title, key, list){
  if (!list.length) return "";
  return '<h4>' + esc(title) + '</h4><div class="chips">' + list.map(function(t){
    var on = state.sel[key].indexOf(t) !== -1;
    return '<button class="tag" aria-pressed="' + on + '" data-f="' + key + '" data-v="' + esc(t) + '" data-close="1" title="Show all case studies tagged ' + esc(t) + '">' + hl(t) + '</button>';
  }).join("") + '</div>';
}
function closePreview(){
  $("pv").hidden = true;
  document.body.style.overflow = "";
  state.open = null;
  writeHash();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function step(n){
  var d = byId(state.open), list = visible.indexOf(d) !== -1 ? visible : DATA;
  var i = (list.indexOf(d) + n + list.length) % list.length;
  openPreview(list[i].id);
}

/* ------------------------------------------------------------ events */
function toggle(f, v){
  var s = state.sel[f], i = s.indexOf(v);
  if (i === -1) s.push(v); else s.splice(i, 1);
  render();
}
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-open],[data-f],[data-more],a[data-pdf]");
  if (!t) return;
  if (t.matches("a[data-pdf]")) {
    if (CFG.embedded) { e.preventDefault(); var d = byId(t.getAttribute("data-pdf")); var a = document.createElement("a"); a.href = pdfHref(d); if (t.hasAttribute("download")) a.download = d.dl; else a.target = "_blank"; a.click(); }
    return;
  }
  if (t.hasAttribute("data-open")) { openPreview(t.getAttribute("data-open")); return; }
  if (t.hasAttribute("data-more")) { var k = t.getAttribute("data-more"); expanded[k] = !expanded[k]; render(); return; }
  if (t.hasAttribute("data-f")) {
    if (t.hasAttribute("data-close")) { state.sel[t.getAttribute("data-f")] = [t.getAttribute("data-v")]; closePreview(); render(); window.scrollTo({top:$("main").offsetTop - 120, behavior:"smooth"}); return; }
    toggle(t.getAttribute("data-f"), t.getAttribute("data-v"));
  }
});
var qTimer;
$("q").addEventListener("input", function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ state.q = $("q").value.trim(); render(); }, 120);
});
$("clrQ").addEventListener("click", function(){ $("q").value = ""; state.q = ""; render(); $("q").focus(); });
$("sort").addEventListener("change", function(){ state.sort = this.value; render(); });
function clearAll(){ FACETS.forEach(function(f){ state.sel[f.key] = []; }); state.q = ""; $("q").value = ""; render(); }
$("clrAll").addEventListener("click", clearAll);
$("resetBtn").addEventListener("click", clearAll);

function setRail(open){ $("rail").classList.toggle("open", open); $("scrim").hidden = !open; $("railOpen").setAttribute("aria-expanded", open); if (open) $("railClose").focus(); }
$("railOpen").addEventListener("click", function(){ setRail(true); });
$("railClose").addEventListener("click", function(){ setRail(false); });
$("railApply").addEventListener("click", function(){ setRail(false); });
$("scrim").addEventListener("click", function(){ setRail(false); });

$("pvClose").addEventListener("click", closePreview);
$("pvPrev").addEventListener("click", function(){ step(-1); });
$("pvNext").addEventListener("click", function(){ step(1); });
$("pv").addEventListener("click", function(e){ if (e.target === this) closePreview(); });
$("pvCopy").addEventListener("click", function(){
  var url = location.href.split("#")[0] + "#case=" + encodeURIComponent(state.open);
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function(){ toast("Link copied"); }, function(){ toast(url); });
});
var tt;
function toast(msg){ var el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ el.hidden = true; }, 2200); }

document.addEventListener("keydown", function(e){
  if (!$("pv").hidden) {
    if (e.key === "Escape") closePreview();
    else if (e.key === "ArrowLeft" && !/INPUT|SELECT/.test(e.target.tagName)) step(-1);
    else if (e.key === "ArrowRight" && !/INPUT|SELECT/.test(e.target.tagName)) step(1);
    else if (e.key === "Tab") {           // keep focus inside the dialog
      var f = $("pv").querySelectorAll("button:not([disabled]):not([hidden]),a[href]");
      f = Array.prototype.filter.call(f, function(x){ return x.offsetParent !== null; });
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (e.key === "Escape" && $("rail").classList.contains("open")) { setRail(false); return; }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { e.preventDefault(); $("q").focus(); }
});
window.addEventListener("hashchange", function(){ readHash(); $("q").value = state.q; render(); if (state.open) openPreview(state.open); else if (!$("pv").hidden) closePreview(); });

/* ------------------------------------------------------------ boot */
$("heroSub").textContent = DATA.length + " one-pagers. Search the full text, then narrow down by client, domain, service or location.";
readHash();
$("q").value = state.q;
render();
if (state.open) openPreview(state.open);
})();
</script>
</body>
</html>
